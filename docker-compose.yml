services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/review_intelligence.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - review_data:/app/data
    ports: ["8000:8000"]
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  review_data:
